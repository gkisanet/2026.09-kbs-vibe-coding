<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend App (PC 1) - 3-Tier REST & 실시간 채팅</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(30, 41, 59, 0.75);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-cyan: #06b6d4;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --danger: #ef4444;
    }
    body {
      font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .app-container {
      width: 100%;
      max-width: 680px;
    }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { margin: 0; font-size: 1.6rem; color: #818cf8; }
    .header p { color: var(--text-muted); font-size: 0.9rem; margin-top: 5px; }

    .config-box {
      background: #1e1b4b;
      border: 1px solid #4338ca;
      padding: 12px 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }
    .config-box input {
      width: calc(100% - 100px);
      padding: 6px 10px;
      background: #0f172a;
      border: 1px solid #3730a3;
      color: var(--text);
      border-radius: 6px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .card h2 { margin-top: 0; font-size: 1.15rem; border-bottom: 1px solid var(--border); padding-bottom: 10px; color: #a5b4fc; }

    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: var(--text-muted); }
    input[type="text"], input[type="password"], textarea {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    .btn-secondary { background: #334155; margin-top: 8px; }

    .user-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #312e81;
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    /* 채팅 스타일 */
    .chat-layout {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 15px;
      height: 320px;
    }
    .room-list-box {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      overflow-y: auto;
    }
    .room-item {
      padding: 8px 10px;
      background: #1e293b;
      border-radius: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
    }
    .room-item:hover { background: #334155; }
    .chat-box {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .chat-header-sub {
      padding: 8px 10px;
      background: #1e293b;
      font-size: 0.85rem;
      font-weight: bold;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }
    .chat-messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.85rem;
    }
    .msg-bubble {
      padding: 6px 10px;
      border-radius: 8px;
      max-width: 85%;
    }
    .msg-mine { align-self: flex-end; background: #4f46e5; }
    .msg-other { align-self: flex-start; background: #334155; }
    .msg-sender { font-size: 0.7rem; color: #cbd5e1; margin-bottom: 2px; }
    .chat-input-row {
      display: flex;
      gap: 5px;
      padding: 8px;
      border-top: 1px solid var(--border);
    }
    .chat-input-row input { flex: 1; padding: 6px; font-size: 0.85rem; }
    .chat-input-row button { width: 60px; padding: 6px; font-size: 0.8rem; }
  </style>
  <!-- Socket.io Client CDN -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="header">
      <h1>🌐 Frontend Tier (PC 1)</h1>
      <p>3-Tier API 실습 & 로그인 기반 실시간 대화방 서비스</p>
    </div>

    <!-- 백엔드 서버 IP 설정 -->
    <div class="config-box">
      <label>🔗 연동 백엔드(PC 2) URL 주소 (Port 4000):</label>
      <div style="display: flex; gap: 8px; margin-top: 5px;">
        <input type="text" id="backendUrlInput" value="http://localhost:4000">
        <button style="width: 90px; padding: 6px;" onclick="saveBackendUrl()">저장/연결</button>
      </div>
    </div>

    <!-- Auth Card -->
    <div class="card" id="authCard">
      <h2>🔐 회원가입 및 로그인</h2>
      <div class="form-group">
        <label>아이디 (Username)</label>
        <input type="text" id="authUsername" value="user1">
      </div>
      <div class="form-group">
        <label>비밀번호 (Password)</label>
        <input type="password" id="authPassword" value="password123">
      </div>
      <button onclick="handleLogin()">로그인</button>
      <button class="btn-secondary" onclick="handleRegister()">회원가입</button>
    </div>

    <!-- Main Content Card (로그인 시 노출) -->
    <div id="mainContent" style="display: none;">
      <div class="user-info">
        <span>👤 로그인 사용자: <strong id="loggedInUser">-</strong></span>
        <button style="width: auto; padding: 4px 10px; font-size: 0.8rem; background: #475569;" onclick="handleLogout()">로그아웃</button>
      </div>

      <!-- 1차 데이터 입력 카드 -->
      <div class="card">
        <h2>📝 1차 REST API 데이터 입력 (DB 반영)</h2>
        <div class="form-group">
          <label>제목 (Title)</label>
          <input type="text" id="reportTitle" placeholder="제목 입력">
        </div>
        <div class="form-group">
          <label>내용 (Content)</label>
          <textarea id="reportContent" rows="2" placeholder="상세 내용 입력"></textarea>
        </div>
        <button onclick="handleReportSubmit()">백엔드 및 DB로 저장 (REST POST)</button>
      </div>

      <!-- 실시간 대화방 카드 (Socket.io) -->
      <div class="card">
        <h2>💬 실시간 방 기반 채팅 (Socket.io)</h2>
        
        <div class="chat-layout">
          <!-- 방 목록 섹션 -->
          <div class="room-list-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <span style="font-size: 0.8rem; font-weight: bold;">🏠 대화방 목록</span>
              <button style="width: auto; padding: 2px 6px; font-size: 0.75rem;" onclick="promptCreateRoom()">+ 방생성</button>
            </div>
            <div id="roomListContainer"></div>
          </div>

          <!-- 채팅 영역 -->
          <div class="chat-box">
            <div class="chat-header-sub">
              <span id="chatTitle">방을 선택하세요</span>
              <button style="width: auto; padding: 2px 6px; font-size: 0.7rem; background: #ef4444;" onclick="leaveRoom()">퇴장</button>
            </div>
            <div class="chat-messages" id="chatMessages">
              <div style="color: var(--text-muted); text-align: center; margin-top: 40px; font-size: 0.8rem;">좌측 방을 클릭하여<br>채팅에 참여하세요.</div>
            </div>
            <div class="chat-input-row">
              <input type="text" id="chatMsgInput" placeholder="메시지 입력..." onkeyup="if(event.key==='Enter') sendChatMessage()">
              <button onclick="sendChatMessage()">전송</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    let currentUser = null;
    let socket = null;

    function getBackendUrl() {
      return localStorage.getItem('BACKEND_URL') || document.getElementById('backendUrlInput').value;
    }
    function saveBackendUrl() {
      const url = document.getElementById('backendUrlInput').value.trim();
      localStorage.setItem('BACKEND_URL', url);
      alert(`백엔드 URL이 ${url}(으)로 설정되었습니다.`);
      initSocket();
    }
    document.getElementById('backendUrlInput').value = getBackendUrl();

    // Socket.io 초기화
    function initSocket() {
      if (socket) socket.disconnect();
      socket = io(getBackendUrl());

      socket.on('connect', () => {
        if (currentUser) socket.emit('set_user', { username: currentUser.username });
      });

      socket.on('room_list_update', (rooms) => renderRoomList(rooms));
      socket.on('joined_room', ({ roomName }) => {
        document.getElementById('chatTitle').innerText = roomName;
        document.getElementById('chatMessages').innerHTML = '';
      });

      socket.on('user_joined', ({ username }) => addNotice(`${username} 님이 입장하셨습니다.`));
      socket.on('user_left', ({ username }) => addNotice(`${username} 님이 퇴장하셨습니다.`));

      socket.on('new_message', ({ sender, message, timestamp }) => {
        const container = document.getElementById('chatMessages');
        const isMine = currentUser && sender === currentUser.username;
        const msgEl = document.createElement('div');
        msgEl.className = `msg-bubble ${isMine ? 'msg-mine' : 'msg-other'}`;
        msgEl.innerHTML = `
          ${!isMine ? `<div class="msg-sender">${sender}</div>` : ''}
          <div>${message}</div>
        `;
        container.appendChild(msgEl);
        container.scrollTop = container.scrollHeight;
      });
    }

    async function handleLogin() {
      const username = document.getElementById('authUsername').value.trim();
      const password = document.getElementById('authPassword').value.trim();

      try {
        const res = await fetch(`${getBackendUrl()}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        currentUser = data.user;
        document.getElementById('loggedInUser').innerText = currentUser.username;
        document.getElementById('authCard').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';

        initSocket();
      } catch (err) {
        alert(`로그인 실패: ${err.message}`);
      }
    }

    async function handleRegister() {
      const username = document.getElementById('authUsername').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      try {
        const res = await fetch(`${getBackendUrl()}/api/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        alert('회원가입 완료! 로그인하세요.');
      } catch (err) {
        alert(`회원가입 실패: ${err.message}`);
      }
    }

    function handleLogout() {
      currentUser = null;
      if (socket) socket.disconnect();
      document.getElementById('authCard').style.display = 'block';
      document.getElementById('mainContent').style.display = 'none';
    }

    async function handleReportSubmit() {
      const title = document.getElementById('reportTitle').value.trim();
      const content = document.getElementById('reportContent').value.trim();
      if (!title || !content) return alert('제목과 내용을 입력해주세요.');

      try {
        const res = await fetch(`${getBackendUrl()}/api/reports`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: currentUser.id, title, content })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        alert('REST API를 통해 백엔드 및 DB에 등록되었습니다!');
        document.getElementById('reportTitle').value = '';
        document.getElementById('reportContent').value = '';
      } catch (err) {
        alert(`저장 실패: ${err.message}`);
      }
    }

    // 채팅 관련
    function renderRoomList(rooms) {
      const container = document.getElementById('roomListContainer');
      container.innerHTML = rooms.map(r => `
        <div class="room-item" onclick="joinRoom('${r.id}')">
          <span>${r.name}</span>
          <span style="font-size: 0.75rem; color:#38bdf8;">${r.memberCount}명</span>
        </div>
      `).join('');
    }

    function promptCreateRoom() {
      const name = prompt('개설할 방 제목을 입력하세요:');
      if (name && socket) socket.emit('create_room', { roomName: name });
    }

    function joinRoom(roomId) {
      if (socket) socket.emit('join_room', { roomId });
    }

    function leaveRoom() {
      if (socket) socket.emit('leave_room');
      document.getElementById('chatTitle').innerText = '방을 선택하세요';
      document.getElementById('chatMessages').innerHTML = '<div style="color: var(--text-muted); text-align: center; margin-top: 40px; font-size: 0.8rem;">좌측 방을 클릭하여<br>채팅에 참여하세요.</div>';
    }

    function sendChatMessage() {
      const input = document.getElementById('chatMsgInput');
      const msg = input.value.trim();
      if (msg && socket) {
        socket.emit('send_message', { message: msg });
        input.value = '';
      }
    }

    function addNotice(msg) {
      const container = document.getElementById('chatMessages');
      const notice = document.createElement('div');
      notice.style.cssText = 'font-size: 0.75rem; color: #94a3b8; text-align: center; margin: 4px 0;';
      notice.innerText = msg;
      container.appendChild(notice);
      container.scrollTop = container.scrollHeight;
    }
  </script>
</body>
</html>
