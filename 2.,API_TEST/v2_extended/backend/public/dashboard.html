<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backend Admin Dashboard (PC 2)</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-green: #4ade80;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid #334155;
      margin-bottom: 20px;
    }
    h1 { margin: 0; font-size: 1.5rem; color: var(--accent); }
    .badge {
      background: #0284c7;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .stat-value {
      font-size: 2rem;
      font-weight: bold;
      color: var(--accent-green);
      margin-top: 5px;
    }
    .section-title {
      font-size: 1.2rem;
      margin-bottom: 10px;
      color: var(--accent);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 30px;
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #334155;
    }
    th {
      background: #0f172a;
      color: var(--text-muted);
      font-weight: 600;
    }
    tr:hover { background: #26334d; }
    .btn-refresh {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-refresh:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🖥️ Backend Tier (PC 2) - 대시보드</h1>
      <div>
        <span class="badge">1차 기본 스키마</span>
        <button class="btn-refresh" onclick="fetchDashboardData()">↻ 새로고침</button>
      </div>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div>총 회원 수</div>
        <div class="stat-value" id="userCount">0 명</div>
      </div>
      <div class="stat-card">
        <div>총 등록 데이터 건수</div>
        <div class="stat-value" id="reportCount">0 건</div>
      </div>
    </div>

    <div class="section-title">👥 가입된 사용자 목록</div>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>아이디 (Username)</th>
          <th>역할 (Role)</th>
          <th>가입일시</th>
        </tr>
      </thead>
      <tbody id="userTableBody">
        <tr><td colspan="4">데이터 로딩 중...</td></tr>
      </tbody>
    </table>

    <div class="section-title">📊 입력된 데이터 목록</div>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>작성자</th>
          <th>제목 (Title)</th>
          <th>내용 (Content)</th>
          <th>등록일시</th>
        </tr>
      </thead>
      <tbody id="reportTableBody">
        <tr><td colspan="5">데이터 로딩 중...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    async function fetchDashboardData() {
      try {
        const res = await fetch('/api/dashboard/stats');
        const data = await res.json();

        document.getElementById('userCount').innerText = `${data.userCount} 명`;
        document.getElementById('reportCount').innerText = `${data.reportCount} 건`;

        // 사용자 테이블 갱신
        const userTbody = document.getElementById('userTableBody');
        if (data.users.length === 0) {
          userTbody.innerHTML = '<tr><td colspan="4">등록된 사용자가 없습니다.</td></tr>';
        } else {
          userTbody.innerHTML = data.users.map(u => `
            <tr>
              <td>${u.id}</td>
              <td><strong>${u.username}</strong></td>
              <td>${u.role}</td>
              <td>${new Date(u.created_at).toLocaleString('ko-KR')}</td>
            </tr>
          `).join('');
        }

        // 리포트 테이블 갱신
        const reportTbody = document.getElementById('reportTableBody');
        if (data.reports.length === 0) {
          reportTbody.innerHTML = '<tr><td colspan="5">입력된 데이터가 없습니다.</td></tr>';
        } else {
          reportTbody.innerHTML = data.reports.map(r => `
            <tr>
              <td>${r.id}</td>
              <td><strong>${r.username || '알수없음'}</strong></td>
              <td>${r.title}</td>
              <td>${r.content}</td>
              <td>${new Date(r.created_at).toLocaleString('ko-KR')}</td>
            </tr>
          `).join('');
        }
      } catch (err) {
        console.error('대시보드 로딩 실패:', err);
      }
    }

    // 초기에 데이터 1회 로드 및 5초마다 자동 갱신
    fetchDashboardData();
    setInterval(fetchDashboardData, 5000);
  </script>
</body>
</html>
